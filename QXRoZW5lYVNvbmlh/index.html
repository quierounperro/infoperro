<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athenea</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f4f8;
      color: #333;
    }

    .container {
      max-width: 420px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .header {
      background: #ff6b6b;
      color: white;
      padding: 16px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .alert {
      background: #ffe3e3;
      color: #c92a2a;
      padding: 12px;
      text-align: center;
      font-weight: bold;
    }

    .photo {
      width: 100%;
      height: 250px;
      background: #ddd;
      background-size: cover;
      background-position: center;
    }

    .content {
      padding: 16px;
    }

    .section {
      margin-bottom: 14px;
    }

    .label {
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
    }

    .btn {
      display: block;
      text-align: center;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    .owner {
      background: #339af0;
    }

    .vet {
      background: #51cf66;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">

    <div class="header">
      <h1>🐶 Athenea</h1>
    </div>

    <div class="alert">
      ⚠️ PERRO PERDIDO – POR FAVOR AYUDA
    </div>

    <!-- FOTO (pon aquí la URL de tu imagen) -->
    <div class="photo" style="background-image: url('https://via.placeholder.com/400x250');"></div>

    <div class="content">

      <div class="section">
        <span class="label">🧠 Comportamiento</span>
        Tranquila, pero puede asustarse con desconocidos
      </div>

      <div class="section">
        <span class="label">🚪 Escapista</span>
        Sí
      </div>

      <div class="section">
        <span class="label">🍽️ Alimentación / alergias</span>
        No darle pollo (alergia)
      </div>

      <a class="btn owner" href="tel:+34123456789">
        📞 Llamar al dueño
      </a>

      <a class="btn vet" href="tel:+34987654321">
        🏥 Llamar al veterinario
      </a>

    </div>
  </div>

  <div class="footer">
    Gracias por ayudar 🐾
  </div>
</div>

</body>
</html>
